<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Native Barcode API Scanner</title>
  </head>
  <body>
    <div
      style="
        max-width: 400px;
        margin: auto;
        text-align: center;
        font-family: sans-serif;
      "
    >
      <h2>Native Browser Scanner</h2>
      <video
        id="webcam"
        autoplay
        playsinline
        style="width: 100%; height: 300px; background: #000; object-fit: cover"
      ></video>
      <p><strong>Result:</strong> <span id="result">Scanning...</span></p>
    </div>

    <script>
      const video = document.getElementById("webcam");
      const resultSpan = document.getElementById("result");

      // 1. Check if the browser natively supports this feature
      if (!("BarcodeDetector" in window)) {
        resultSpan.innerText =
          "BarcodeDetector API not supported in this browser.";
        resultSpan.style.color = "red";
      } else {
        // 2. Initialize native reader exclusively for QR Codes
        const barcodeDetector = new BarcodeDetector({ formats: ["qr_code"] });

        // 3. Request webcam stream
        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: "environment" } })
          .then((stream) => {
            video.srcObject = stream;
            // Start processing loops once video plays
            video.addEventListener("play", () => {
              window.setInterval(async () => {
                try {
                  // 4. Pass the live video element frames directly into native detector
                  const barcodes = await barcodeDetector.detect(video);
                  if (barcodes.length > 0) {
                    resultSpan.innerText = barcodes[0].rawValue;
                    resultSpan.style.color = "#10b981";
                  }
                } catch (e) {
                  console.error(e);
                }
              }, 300); // Check every 300ms
            });
          })
          .catch((err) => {
            resultSpan.innerText = "Camera access denied.";
            console.error(err);
          });
      }
    </script>
  </body>
</html>
